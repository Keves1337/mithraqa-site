<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MITHRA — Nothing ships unseen</title>
<meta name="description" content="MITHRA QA/Audit. AI-powered QA and security audits that run on your own machine. Coming soon.">
<meta name="theme-color" content="#050505">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://mithraqa.com/">
<meta property="og:title" content="MITHRA — Nothing ships unseen">
<meta property="og:description" content="AI-powered QA and security audits on your own machine. Coming soon.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://mithraqa.com/">
<meta property="og:image" content="https://mithraqa.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://mithraqa.com/og.png">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
<style>
:root{
  --u:calc(100vh/1058); --uw:calc(100vw/1487);
  --h:clamp(var(--u),calc(var(--u)*.65 + var(--uw)*.35),calc(var(--u)*1.16));
  --ink:#fafafa; --muted:#a7a6a6; --nav:#b6b5b5; --strip:#8b8a8a; --gold:#e8c47c;
  --pill:#fff; --pill-ink:#050505; --bg:#050505;
  --ease:cubic-bezier(.22,1,.36,1);
}
@supports (height:100dvh){:root{--u:calc(100dvh/1058)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
a{color:inherit;text-decoration:none}
.stage{position:fixed;inset:0;overflow:hidden;background:var(--bg)}

/* video plate */
.plate{position:absolute;inset:0;pointer-events:none}
.plate-video{position:absolute;left:50%;top:calc(1*var(--u));width:calc(1492*var(--u));height:calc(1054*var(--u));
  transform:translateX(calc(-50% - .5*var(--u)));object-fit:cover}
.plate::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to bottom,rgba(5,5,5,0) 78.8%,rgba(5,5,5,.23) 79.6%,rgba(5,5,5,.45) 81.4%,rgba(5,5,5,.75) 83.3%,rgba(5,5,5,.84) 85.2%,rgba(5,5,5,.888) 88%,rgba(5,5,5,.905) 91%,rgba(5,5,5,.96) 95%,#050505 100%),
  linear-gradient(to right,#050505 calc(50% - 746*var(--u)),transparent calc(50% - 676*var(--u)),transparent calc(50% + 676*var(--u)),#050505 calc(50% + 746*var(--u)))}

/* header */
.brand{position:absolute;left:calc(75*var(--u));top:calc(24*var(--u));display:flex;align-items:center;gap:calc(14*var(--u))}
.brand img{width:calc(54*var(--u));height:calc(54*var(--u));display:block}
.brand span{font-size:calc(19*var(--u));letter-spacing:.34em;font-weight:500;color:var(--gold)}
.links{position:absolute;left:50%;top:calc(51*var(--u));transform:translate(-50%,-50%);display:flex;gap:calc(25*var(--u));
  font-size:calc(19*var(--u));color:var(--nav)}
.links a:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--pill);color:var(--pill-ink);border-radius:999px;font-weight:500;transition:transform .3s var(--ease),background .3s}
.pill:hover{transform:translateY(-1px);background:#f1e6cf}
.pill span{transform:translateY(calc(1*var(--u)))}
.pill-nav{position:absolute;right:calc(75.4*var(--u));top:calc(27*var(--u));width:calc(175*var(--u));height:calc(49*var(--u));font-size:calc(20.6*var(--u))}
.burger{display:none}
.menu{display:none}

/* hero */
.headline{position:absolute;left:calc(75.5*var(--u));top:calc(230.5*var(--u));font-weight:400;
  font-size:calc(71.6*var(--h));line-height:calc(80.5*var(--h));letter-spacing:calc(.3*var(--h));white-space:nowrap}
.headline span{display:block}
.headline em{font-style:normal;color:var(--gold)}
.sub{position:absolute;left:calc(75.5*var(--u));top:calc(230.5*var(--u) + 189*var(--h));color:var(--muted);
  font-size:calc(20.7*var(--h));line-height:calc(23.5*var(--h));word-spacing:calc(1.8*var(--h))}
.sub span{display:block;white-space:nowrap}
.pill-cta{position:absolute;left:calc(74.9*var(--u));top:calc(230.5*var(--u) + 264.5*var(--h));width:calc(175.6*var(--h));height:calc(50*var(--h));font-size:calc(20.6*var(--h))}
.ghost{position:absolute;left:calc(74.9*var(--u) + 220.6*var(--h));top:calc(230.5*var(--u) + 279.5*var(--h));font-size:calc(20.6*var(--h));font-weight:500;letter-spacing:calc(.12*var(--h));color:#fff;opacity:.9}

/* capability strip (in place of partner logos: MITHRA has none yet, so no fake ones) */
.logos{position:absolute;left:50%;top:calc(992*var(--u));transform:translateX(-50%);display:flex;gap:calc(46*var(--u));
  color:var(--strip);font-size:calc(17*var(--u));font-weight:600;letter-spacing:.04em;white-space:nowrap}
.lg{display:flex;align-items:center;gap:calc(10*var(--u))}
.lg svg{width:calc(24*var(--u));height:calc(24*var(--u));flex:none}

/* entrance */
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;transform:translateY(calc(14*var(--u)))}}
  @keyframes riseNav{from{opacity:0;transform:translate(-50%,calc(-50% + 14*var(--u)))}to{opacity:1;transform:translate(-50%,-50%)}}
  @keyframes fade{from{opacity:0}}
  .brand,.pill-nav{animation:rise .8s var(--ease) both}
  .links{animation:riseNav .8s var(--ease) both}
  .headline{animation:rise .9s var(--ease) .06s both}
  .sub{animation:rise .9s var(--ease) .14s both}
  .pill-cta,.ghost{animation:rise .9s var(--ease) .22s both}
  .lg{animation:fade 1.1s ease .34s both}
}

/* portrait / phone: flow layout */
@media (max-aspect-ratio:11/10){
  :root{--m:min(100vw/430,1.34px);--u:var(--m);--h:var(--m)}
  html,body{overflow:auto}
  .stage{position:relative;min-height:100dvh;display:flex;flex-direction:column;
    padding:max(18px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom))}
  .plate-video{inset:0;left:0;top:0;width:100%;height:100%;transform:none;object-position:43% center}
  .plate::after{background:
    linear-gradient(to right,rgba(5,5,5,.86),rgba(5,5,5,.66) 42%,rgba(5,5,5,.2) 78%,rgba(5,5,5,.1)),
    linear-gradient(to bottom,rgba(5,5,5,.72),rgba(5,5,5,.34) 24%,rgba(5,5,5,.34) 56%,rgba(5,5,5,.8) 82%,rgba(5,5,5,.97) 94%,#050505)}
  .brand,.headline,.sub,.pill-cta,.ghost,.logos{position:relative;left:auto;top:auto;right:auto;transform:none}
  header{position:relative;display:flex;justify-content:space-between;align-items:center;z-index:3}
  .brand img{width:44px;height:44px}.brand span{font-size:15px}
  .links,.pill-nav{display:none}
  .burger{display:grid;place-content:center;gap:6px;width:48px;height:48px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .burger i{display:block;width:18px;height:1.5px;background:#fff;transition:transform .35s var(--ease)}
  .is-open .burger i:first-child{transform:translateY(3.75px) rotate(45deg)}
  .is-open .burger i:last-child{transform:translateY(-3.75px) rotate(-45deg)}
  .menu{display:block;position:fixed;inset:0;z-index:2;opacity:0;visibility:hidden;transition:opacity .42s,visibility .42s;
    background:linear-gradient(180deg,rgba(5,5,5,.9),rgba(5,5,5,.97));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
  .is-open .menu{opacity:1;visibility:visible}
  .menu-inner{padding:110px 26px 40px;display:flex;flex-direction:column;gap:26px}
  .menu-eyebrow{color:var(--strip);letter-spacing:.3em;text-transform:uppercase;font-size:12px}
  .menu-list{list-style:none;display:grid;gap:14px}
  .menu-list a{font-size:max(25px,31px);display:flex;justify-content:space-between}
  .menu-list a::after{content:"›";color:var(--strip)}
  main.hero{position:relative;z-index:1;margin-top:auto;padding-top:38vh}
  .headline{white-space:normal;font-size:calc(46*var(--m));line-height:1.08}
  .headline span{display:inline}
  .sub{margin-top:18px;font-size:16px;line-height:1.45}
  .sub span{display:inline;white-space:normal}
  .actions{display:flex;align-items:center;gap:22px;margin-top:26px}
  .pill-cta{width:auto;height:50px;padding:0 26px;font-size:16px}
  .ghost{font-size:16px}
  .logos{z-index:1;margin-top:42px;display:grid;grid-template-columns:1fr 1fr;gap:16px 18px;font-size:13px}
  .lg svg{width:20px;height:20px}
}
@media (min-width:600px) and (max-aspect-ratio:11/10){
  :root{--m:min(100vw/860,100vh/760,1.25px)}
  .plate-video{object-position:44% center}
  .headline span{display:block}
  .logos{display:flex;flex-wrap:nowrap;gap:28px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){.menu,.burger i{transition-duration:.001s}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="plate">
    <video class="plate-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="assets/hero.mp4" type="video/mp4">
    </video>
  </div>

  <header>
    <a class="brand" href="./" aria-label="MITHRA home"><img src="logo.svg" alt=""><span>MITHRA</span></a>
    <nav class="links" aria-label="Primary">
      <a href="demo/">Demo</a><a href="#capabilities">What it audits</a>
    </nav>
    <a class="pill pill-nav" href="demo/"><span>See the demo</span></a>
    <button class="burger" id="burger" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><i></i><i></i></button>
  </header>

  <nav class="menu" id="menu" aria-hidden="true">
    <div class="menu-inner">
      <p class="menu-eyebrow">Menu</p>
      <ul class="menu-list">
        <li><a href="demo/">Demo</a></li>
        <li><a href="#capabilities">What it audits</a></li>
      </ul>
    </div>
  </nav>

  <main class="hero">
    <h1 class="headline"><span>Nothing ships</span> <span><em>unseen.</em></span></h1>
    <p class="sub">
      <span>AI-powered QA and security audits on your own machine.</span>
      <span>Every page, every API, before your users find a bug.</span>
    </p>
    <div class="actions">
      <a class="pill pill-cta" href="demo/"><span>See the demo</span></a>
      <span class="ghost">Coming soon</span>
    </div>
  </main>

  <div class="logos" id="capabilities" aria-label="What MITHRA audits">
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>Security scans</div>
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h13"/><circle cx="19" cy="15" r="3"/></svg>AI test cases</div>
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l5-6 4 4 7-9"/><path d="M15 6h4v4"/></svg>Load &amp; fuzz testing</div>
    <div class="lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Runs on-prem</div>
  </div>
</div>
<script>
(() => {
  const stage = document.getElementById("stage"), burger = document.getElementById("burger"), menu = document.getElementById("menu");
  const set = open => {
    stage.classList.toggle("is-open", open);
    burger.setAttribute("aria-expanded", open); menu.setAttribute("aria-hidden", !open);
    burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  };
  burger.addEventListener("click", () => set(!stage.classList.contains("is-open")));
  menu.addEventListener("click", e => { if (e.target.closest("a")) set(false); });
  addEventListener("keydown", e => { if (e.key === "Escape") set(false); });
  addEventListener("resize", () => { if (innerWidth / innerHeight > 1.1) set(false); });
})();
</script>
</body>
</html>
