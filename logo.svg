<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#fff1c8"/>
      <stop offset="0.35" stop-color="#e8c47c"/>
      <stop offset="0.65" stop-color="#b88a3c"/>
      <stop offset="1" stop-color="#7a5320"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5a3c14"/>
      <stop offset="1" stop-color="#d9b26a"/>
    </linearGradient>
    <radialGradient id="plate" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#3a2a16"/>
      <stop offset="0.7" stop-color="#1c140a"/>
      <stop offset="1" stop-color="#0d0905"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.35" stop-color="#f0c770"/>
      <stop offset="0.8" stop-color="#9c6a26"/>
      <stop offset="1" stop-color="#5b3b12"/>
    </radialGradient>
    <g id="rayL"><path d="M128 4 L134 34 L128 40 L122 34 Z"/></g>
    <g id="rayS"><path d="M128 24 L133 40 L128 45 L123 40 Z"/></g>
  </defs>
  <!-- rays: 12, alternating long and short, with a light top edge for bevel -->
  <g fill="url(#gold)">
    <use href="#rayL"/><use href="#rayS" transform="rotate(30 128 128)"/>
    <use href="#rayL" transform="rotate(60 128 128)"/><use href="#rayS" transform="rotate(90 128 128)"/>
    <use href="#rayL" transform="rotate(120 128 128)"/><use href="#rayS" transform="rotate(150 128 128)"/>
    <use href="#rayL" transform="rotate(180 128 128)"/><use href="#rayS" transform="rotate(210 128 128)"/>
    <use href="#rayL" transform="rotate(240 128 128)"/><use href="#rayS" transform="rotate(270 128 128)"/>
    <use href="#rayL" transform="rotate(300 128 128)"/><use href="#rayS" transform="rotate(330 128 128)"/>
  </g>
  <!-- bronze plate with engraved rings -->
  <circle cx="128" cy="128" r="70" fill="url(#plate)"/>
  <g fill="none" stroke="#4a361b" stroke-width="0.8" opacity="0.8">
    <circle cx="128" cy="128" r="60"/><circle cx="128" cy="128" r="52"/><circle cx="128" cy="128" r="44"/>
  </g>
  <!-- raised ring: dark underside + gold face for depth -->
  <circle cx="128" cy="130" r="74" fill="none" stroke="url(#goldEdge)" stroke-width="11"/>
  <circle cx="128" cy="128" r="74" fill="none" stroke="url(#gold)" stroke-width="9"/>
  <circle cx="128" cy="126" r="76.5" fill="none" stroke="#fff3cf" stroke-width="1.2" opacity="0.7"/>
  <!-- eye outline, bevelled -->
  <path d="M74 130 Q128 82 182 130 Q128 178 74 130 Z" fill="none" stroke="#3a2610" stroke-width="7"/>
  <path d="M74 128 Q128 80 182 128 Q128 176 74 128 Z" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <!-- domed iris with pupil -->
  <circle cx="128" cy="130" r="23" fill="#2a1a08"/>
  <circle cx="128" cy="128" r="22" fill="url(#iris)"/>
  <circle cx="128" cy="128" r="7.5" fill="#120b03"/>
  <circle cx="121" cy="121" r="4" fill="#fffaf0" opacity="0.9"/>
</svg>
